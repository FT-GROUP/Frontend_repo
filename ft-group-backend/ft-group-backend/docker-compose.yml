version: "3.8"

# Levanta unicamente PostgreSQL para desarrollo local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: ft_group_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ft_group
    ports:
      - "5432:5432"
    volumes:
      - ft_group_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ft_group_pgdata:
